[package]
name = "apollo"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Apollo 绘图引擎 — 稳定公共 Rust 门面"
publish = false

[features]
default = ["svg"]
## SVG 矢量后端（默认启用）。
svg = ["dep:apollo-backend-svg"]
## 可选 WGPU / WebGPU 后端（核心构建不需要）。
wgpu = ["dep:apollo-backend-wgpu"]

[dependencies]
apollo-types = { workspace = true }
apollo-data = { workspace = true }
apollo-grammar = { workspace = true }
apollo-scene = { workspace = true }
apollo-layout = { workspace = true }
apollo-render = { workspace = true }
apollo-backend-svg = { workspace = true, optional = true }
apollo-backend-wgpu = { workspace = true, optional = true }

[dev-dependencies]
apollo-data = { workspace = true }
apollo-grammar = { workspace = true }
apollo-backend-svg = { workspace = true }
apollo-backend-wgpu = { workspace = true }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
